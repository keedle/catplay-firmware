name: AirPlay probe target preflight

on:
  workflow_dispatch:
  push:
    branches: [feature/airplay-mirroring-poc]
    paths:
      - .github/workflows/airplay-probe-preflight.yml
      - scripts/airplay-probe-preflight.sh
      - meta-catplay/recipes-apps/catplay-airplay-probe.bb

permissions:
  contents: read

concurrency:
  group: airplay-probe-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    if: github.repository == 'keedle/catplay-firmware'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CATPLAY_PROBE_SOURCE_REV: 886bb2ad9b930c14e9a31e54c3671033e7934001
    steps:
      - name: Check out development firmware metadata
        uses: actions/checkout@v4
        with:
          path: firmware
          persist-credentials: false
      - name: Check out the reviewed probe source
        uses: actions/checkout@v4
        with:
          repository: keedle/catplay
          ref: 886bb2ad9b930c14e9a31e54c3671033e7934001
          path: catplay
          persist-credentials: false
      - name: Install parse host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential chrpath cpio debianutils diffstat file gawk git \
            iproute2 libacl1 locales python3 python3-git python3-jinja2 \
            python3-pexpect python3-subunit socat texinfo unzip wget xz-utils zstd
          sudo locale-gen en_US.UTF-8
      - name: Inspect resources, parse metadata and generate probe dependency graph
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: firmware/scripts/airplay-probe-preflight.sh catplay
      - name: Upload preflight evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airplay-probe-preflight-${{ github.run_id }}
          path: firmware/build/airplay-probe-preflight/reports
          if-no-files-found: warn
          retention-days: 7
