name: AirPlay probe target build
run-name: ${{ inputs.build_probe && 'Compile MIPS receiver probe' || 'Check MIPS build configuration' }}

on:
  workflow_dispatch:
    inputs:
      build_probe:
        description: Compile the diagnostic probe after configuration and resource checks
        type: boolean
        default: false
        required: true
  push:
    branches: [feature/airplay-mirroring-poc]
    paths:
      - .github/workflows/airplay-probe-preflight.yml
      - scripts/airplay-probe-preflight.sh
      - scripts/airplay-probe-build.sh
      - scripts/airplay-probe-sstate-cache.py
      - meta-catplay/recipes-apps/catplay-airplay-probe.bb

permissions:
  contents: read
  actions: write

concurrency:
  group: airplay-probe-${{ github.event_name == 'workflow_dispatch' && inputs.build_probe && 'build' || 'preflight' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'keedle/catplay-firmware'
    # Ubuntu 24.04's hosted AppArmor policy blocks BitBake user namespaces.
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.build_probe && 330 || 35 }}
    env:
      CATPLAY_PROBE_SOURCE_REV: 886bb2ad9b930c14e9a31e54c3671033e7934001
    steps:
      - name: Check out development firmware metadata
        uses: actions/checkout@v4
        with:
          path: firmware
          persist-credentials: false
      - name: Check out the reviewed probe source
        uses: actions/checkout@v4
        with:
          repository: keedle/catplay
          ref: 886bb2ad9b930c14e9a31e54c3671033e7934001
          path: catplay
          persist-credentials: false
      - name: Install parse host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential chrpath cpio debianutils diffstat file gawk git \
            iproute2 libacl1 locales python3 python3-git python3-jinja2 \
            python3-pexpect python3-subunit socat texinfo unzip wget xz-utils zstd
          sudo locale-gen en_US.UTF-8
      - name: Check BitBake user namespace support
        run: unshare -Ur true
      - name: Inspect resources, parse metadata and generate probe dependency graph
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: firmware/scripts/airplay-probe-preflight.sh catplay
      - name: Identify the compatible sstate cache generation
        id: sstate_keys
        if: github.event_name == 'workflow_dispatch' && inputs.build_probe
        run: python3 firmware/scripts/airplay-probe-sstate-cache.py keys firmware
      - name: Restore a compatible bounded sstate generation
        id: sstate_restore
        if: github.event_name == 'workflow_dispatch' && inputs.build_probe
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: firmware/build/airplay-probe-preflight/sstate-cache-input
          key: ${{ steps.sstate_keys.outputs.generation }}
          restore-keys: ${{ steps.sstate_keys.outputs.prefix }}
      - name: Validate and import completed sstate objects
        if: github.event_name == 'workflow_dispatch' && inputs.build_probe && steps.sstate_restore.outcome == 'success'
        run: python3 firmware/scripts/airplay-probe-sstate-cache.py restore firmware
      - name: Prepare disk space on the disposable hosted runner
        if: github.event_name == 'workflow_dispatch' && inputs.build_probe
        timeout-minutes: 10
        run: |
          set -euo pipefail
          [[ "${GITHUB_ACTIONS:-}" == true && "${GITHUB_REPOSITORY:-}" == keedle/catplay-firmware && "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]
          mkdir -p firmware/build/airplay-probe-preflight/probe-artifacts
          report=firmware/build/airplay-probe-preflight/probe-artifacts/runner-disk-preparation.txt
          df -Pk . > "$report"
          available_kib="$(df -Pk . | awk 'NR == 2 {print $4}')"
          if (( available_kib < 52428800 )); then
            # These stock image tools are unused by the Linux/MIPS build.
            # Keep the workspace, native compilers, Python and Rust toolchains.
            for unused in /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL; do
              if [[ -d "$unused" ]]; then
                du -sk "$unused" >> "$report"
              fi
            done
            sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          fi
          df -Pk . >> "$report"
      - name: Compile the MIPS diagnostic probe and collect binary evidence
        if: github.event_name == 'workflow_dispatch' && inputs.build_probe
        run: firmware/scripts/airplay-probe-build.sh
      - name: Confirm the BitBake server stopped before cache snapshot
        if: always() && github.event_name == 'workflow_dispatch' && inputs.build_probe && steps.sstate_keys.outcome == 'success'
        timeout-minutes: 2
        run: |
          firmware_root="$GITHUB_WORKSPACE/firmware"
          build_dir="$firmware_root/build/airplay-probe-preflight/yocto"
          artifact_dir="$firmware_root/build/airplay-probe-preflight/probe-artifacts"
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          set +u
          source "$firmware_root/openembedded-core/oe-init-build-env" "$build_dir" "$firmware_root/bitbake"
          set -u
          mkdir -p "$artifact_dir"
          if timeout --signal=TERM --kill-after=5s 30s bitbake --kill-server \
              > "$artifact_dir/server-stop.log" 2>&1; then
            printf 'stop_status=0\n' > "$artifact_dir/bitbake-server-stop.txt"
          else
            printf 'stop_status=1\n' > "$artifact_dir/bitbake-server-stop.txt"
          fi
      - name: Stage completed sstate objects after the build stops
        id: sstate_stage
        if: always() && github.event_name == 'workflow_dispatch' && inputs.build_probe && steps.sstate_keys.outcome == 'success'
        timeout-minutes: 10
        run: python3 firmware/scripts/airplay-probe-sstate-cache.py stage firmware
      - name: Save this bounded sstate generation
        id: sstate_save
        if: always() && steps.sstate_stage.outputs.save == 'true'
        timeout-minutes: 45
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: firmware/build/airplay-probe-preflight/sstate-cache-input
          key: ${{ steps.sstate_keys.outputs.generation }}
      - name: Rotate old generations for this sstate prefix
        if: always() && steps.sstate_save.outcome == 'success'
        timeout-minutes: 3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 firmware/scripts/airplay-probe-sstate-cache.py rotate firmware
      - name: Upload target build output and diagnostics
        if: always() && github.event_name == 'workflow_dispatch' && inputs.build_probe
        uses: actions/upload-artifact@v4
        with:
          name: airplay-mips-probe-${{ github.run_id }}
          path: firmware/build/airplay-probe-preflight/probe-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload preflight evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airplay-probe-preflight-${{ github.run_id }}
          path: firmware/build/airplay-probe-preflight/reports
          if-no-files-found: warn
          retention-days: 7
